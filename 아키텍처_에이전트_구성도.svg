<svg viewBox="0 0 980 850" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="850" fill="#ffffff"/>

  <text x="40" y="36" font-size="19" font-weight="700" fill="#1a1a1a">인프라 아키텍처 제안·검증 에이전트 구성 (초안)</text>
  <text x="40" y="57" font-size="11.5" fill="#777">5개 구성 · 첫 버전은 결정 1건(ETL 전환)을 ①→⑤로 끝까지 통과</text>

  <!-- 입력원 -->
  <text x="40" y="92" font-size="11" font-weight="700" fill="#999">입력원</text>

  <rect x="40" y="102" width="270" height="56" rx="6" fill="#f4f4f4" stroke="#c4c4c4"/>
  <text x="56" y="124" font-size="12.5" font-weight="700" fill="#444">공개 자료</text>
  <text x="56" y="143" font-size="10.5" fill="#888">사업자 매뉴얼 · 레퍼런스 그림 · 블로그 — 하루 몇천 건</text>

  <rect x="350" y="102" width="260" height="56" rx="6" fill="#f4f4f4" stroke="#c4c4c4"/>
  <text x="366" y="124" font-size="12.5" font-weight="700" fill="#444">회사 맥락</text>
  <text x="366" y="143" font-size="10.5" fill="#888">고정 구조 · 정책 · 가중치 — 비공개, 일반화 수준</text>

  <rect x="650" y="102" width="300" height="56" rx="6" fill="#f4f4f4" stroke="#c4c4c4"/>
  <text x="666" y="124" font-size="12.5" font-weight="700" fill="#444">운영사 안</text>
  <text x="666" y="143" font-size="10.5" fill="#888">PPT, 양식 제각각 → 일반화 텍스트로 투입</text>

  <line x1="175" y1="158" x2="175" y2="192" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="480" y1="158" x2="640" y2="192" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M945,158 L945,410 L926,410" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- ① 동향 수집 -->
  <rect x="40" y="196" width="420" height="118" rx="8" fill="#E8F1FB" stroke="#1565C0" stroke-width="2"/>
  <text x="58" y="222" font-size="14.5" font-weight="700" fill="#0D47A1">① 동향 수집</text>
  <text x="58" y="245" font-size="11.5" fill="#1565C0">공개 자료만 · 출처 · 날짜 · 신뢰도 A~D</text>
  <line x1="58" y1="255" x2="442" y2="255" stroke="#B0CDEA"/>
  <text x="58" y="273" font-size="11" fill="#33507a">· 영역별 선택지와 벤치마크 사례 수집</text>
  <text x="58" y="290" font-size="11" fill="#33507a">· 몇천 건 → 선택지별 대표 근거 몇 건으로 거름</text>
  <text x="58" y="307" font-size="11" fill="#33507a">· refs/ · 비교표 갱신</text>

  <!-- ② 맥락 -->
  <rect x="500" y="196" width="420" height="118" rx="8" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
  <text x="518" y="222" font-size="14.5" font-weight="700" fill="#4A148C">② 맥락</text>
  <rect x="580" y="209" width="46" height="18" rx="9" fill="#6A1B9A"/>
  <text x="603" y="222" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">비공개</text>
  <text x="518" y="245" font-size="11.5" fill="#6A1B9A">이것만 갈아 끼우면 어느 회사든 사용</text>
  <line x1="518" y1="255" x2="902" y2="255" stroke="#D9C2E0"/>
  <text x="518" y="273" font-size="11" fill="#4f3460">· 고정 구조 · 정책 · 제약</text>
  <text x="518" y="290" font-size="11" fill="#4f3460">· 평가 가중치 · 연계 대상(공통 AI 플랫폼)</text>
  <text x="518" y="307" font-size="11" fill="#4f3460">· 실제 값(IP · 계정 ID)은 보유하지 않음</text>

  <!-- 화살표 ①② → ③④ -->
  <line x1="250" y1="314" x2="250" y2="356" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="600" y1="314" x2="400" y2="356" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="760" y1="314" x2="760" y2="356" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="268" y="340" font-size="10" fill="#888">근거 자료</text>
  <text x="508" y="340" font-size="10" fill="#888">조건</text>
  <text x="772" y="340" font-size="10" fill="#888">조건</text>

  <!-- ③ 제안 -->
  <rect x="40" y="360" width="420" height="120" rx="8" fill="#E9F3EA" stroke="#2E7D32" stroke-width="2"/>
  <text x="58" y="386" font-size="14.5" font-weight="700" fill="#1B5E20">③ 제안</text>
  <text x="58" y="409" font-size="11.5" fill="#2E7D32">평가 축 × 가중치로 순위 · 추천안 1개</text>
  <line x1="58" y1="419" x2="442" y2="419" stroke="#BBD8BD"/>
  <text x="58" y="437" font-size="11" fill="#3a5a3c">· 운영사 안도 선택지에 반드시 포함</text>
  <text x="58" y="454" font-size="11" fill="#3a5a3c">· 선택지마다 근거(출처 또는 비용 산식)</text>
  <text x="58" y="471" font-size="11" fill="#3a5a3c">· 근거 없는 선택지는 순위에서 제외</text>

  <line x1="460" y1="420" x2="496" y2="420" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="463" y="412" font-size="10" fill="#888">우리 안</text>

  <!-- ④ 비교분석 -->
  <rect x="500" y="360" width="420" height="120" rx="8" fill="#FDF0E4" stroke="#E65100" stroke-width="2"/>
  <text x="518" y="386" font-size="14.5" font-weight="700" fill="#BF360C">④ 비교분석</text>
  <text x="518" y="409" font-size="11.5" fill="#E65100">무엇이 다른가 — 결론은 내지 않음</text>
  <line x1="518" y1="419" x2="902" y2="419" stroke="#F0C9A8"/>
  <text x="518" y="437" font-size="11" fill="#7a4a28">· 두 안을 표기규칙으로 옮김  ← 실제 병목</text>
  <text x="518" y="454" font-size="11" fill="#7a4a28">· 평가 축 7개 × 두 안 비교표 (빈칸 0)</text>
  <text x="518" y="471" font-size="11" fill="#7a4a28">· 고정 구조에서 벗어난 부분 짚기</text>

  <!-- 화살표 ③④ → ⑤ -->
  <line x1="250" y1="480" x2="250" y2="526" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="710" y1="480" x2="710" y2="526" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="268" y="508" font-size="10" fill="#888">우리 안도 같은 기준으로 공격</text>
  <text x="728" y="508" font-size="10" fill="#888">비교표 · 운영사 주장</text>

  <!-- ⑤ 검증 -->
  <rect x="40" y="530" width="880" height="130" rx="8" fill="#FDECEA" stroke="#C62828" stroke-width="2"/>
  <text x="58" y="556" font-size="14.5" font-weight="700" fill="#B71C1C">⑤ 검증</text>
  <text x="58" y="579" font-size="11.5" fill="#C62828">그 판단이 맞는가 — 판정까지만, 결정은 사람</text>
  <line x1="58" y1="589" x2="902" y2="589" stroke="#EFBDB8"/>
  <text x="58" y="610" font-size="12" font-weight="700" fill="#7a2e2a">사실</text>
  <text x="58" y="628" font-size="11" fill="#7a2e2a">A·B 출처나 검산 가능한 산식으로 확인</text>
  <text x="345" y="610" font-size="12" font-weight="700" fill="#7a2e2a">근거 부족</text>
  <text x="345" y="628" font-size="11" fill="#7a2e2a">확인할 출처·숫자 없음 → 운영사 질문 생성</text>
  <text x="640" y="610" font-size="12" font-weight="700" fill="#7a2e2a">반박</text>
  <text x="640" y="628" font-size="11" fill="#7a2e2a">반대 근거가 A·B 출처로 있음</text>
  <text x="58" y="649" font-size="10.5" fill="#a0605a">비교표에 쓴 출처마다 신뢰도 등급이 붙었는지도 확인</text>

  <!-- 산출물 -->
  <line x1="480" y1="660" x2="480" y2="686" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="40" y="690" width="880" height="50" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
  <text x="58" y="712" font-size="12.5" font-weight="700" fill="#333">산출물 → 회사 PC로 가져가 협의에 사용</text>
  <text x="58" y="730" font-size="11" fill="#666">제안.md · 비교표.md · 검증.md · 질문목록.md  (비공개 저장소 out/)</text>

  <!-- 평가 축 -->
  <rect x="40" y="754" width="880" height="34" rx="6" fill="#fafafa" stroke="#bbb" stroke-dasharray="4 3"/>
  <text x="58" y="776" font-size="11" fill="#555"><tspan font-weight="700">평가 축 (③④⑤ 공통)</tspan>  비용 · 효과 · 효율 · 동향 적합성 · 커스터마이징 · 데이터 정책 · AI 인프라 적합성  —  가중치는 ②</text>

  <text x="40" y="815" font-size="11" fill="#777">실행 위치: 다섯 개 모두 개인 맥 · VM (회사 PC는 도구 설치 불가 — 결과물 열람·협의용)</text>
  <text x="40" y="834" font-size="11" fill="#777">미정: 공통 AI 플랫폼 요건 · 운영사 핵심 주장(도구 통일)의 사실 여부</text>
</svg>
